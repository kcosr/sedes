apply plugin: 'com.android.application'

// The Android version follows the repository's package.json so that
// `npm run version:set` is the only place the product version changes.
// versionCode packs major.minor.patch into one monotonic integer.
def sedesPackage = new groovy.json.JsonSlurper().parse(file("${rootDir}/../package.json"))
def sedesVersionName = sedesPackage.version as String
def sedesVersionParts = sedesVersionName.tokenize('-')[0].tokenize('.').collect { it as Integer }
def sedesVersionCode = sedesVersionParts[0] * 1000000 + sedesVersionParts[1] * 1000 + sedesVersionParts[2]

android {
    namespace = "dev.sedes.local"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "dev.sedes.local"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode sedesVersionCode
        versionName sedesVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        def protocolSource = file("${rootDir}/../src/shared/protocol/application.ts").text
        def protocolVersion = (protocolSource =~ /SEDES_CLIENT_PROTOCOL_VERSION\s*=\s*(\d+)/)[0][1]
        buildConfigField "int", "SEDES_CLIENT_PROTOCOL_VERSION", protocolVersion
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildFeatures { buildConfig = true }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    implementation "org.commonmark:commonmark:0.30.0"
    implementation "org.commonmark:commonmark-ext-gfm-strikethrough:0.30.0"
    implementation "org.commonmark:commonmark-ext-gfm-tables:0.30.0"
    implementation "org.commonmark:commonmark-ext-task-list-items:0.30.0"
    implementation "org.commonmark:commonmark-ext-footnotes:0.30.0"
    testImplementation "junit:junit:$junitVersion"
    testImplementation "org.json:json:20240303"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

// The opt-in socket lane starts a fresh ephemeral server every invocation.
// Its endpoint and credential stay in the test process environment, not Gradle
// properties, command arguments, cached task inputs, or test report output.
tasks.withType(Test).configureEach {
    if (System.getenv('SEDES_SPEECH_TRANSPORT_TEST') == '1') {
        outputs.upToDateWhen { false }
    }
}
