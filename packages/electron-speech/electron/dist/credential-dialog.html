<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; form-action 'none'; base-uri 'none'; frame-src 'none'; connect-src 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Speech credential — Sedes</title>
  <style>
    :root { color-scheme: light dark; font: 15px system-ui, sans-serif; }
    body { margin: 26px; }
    h1 { font-size: 20px; margin: 0 0 14px; }
    p { line-height: 1.5; }
    #endpoint { overflow-wrap: anywhere; font-family: monospace; }
    label { display: block; margin: 20px 0 8px; font-weight: 600; }
    input { box-sizing: border-box; width: 100%; padding: 10px; font: inherit; }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 22px; }
    button { padding: 8px 12px; font: inherit; cursor: pointer; }
    #message { min-height: 44px; }
  </style>
</head>
<body>
  <h1 id="title">Speech credential</h1>
  <p id="endpoint"></p>
  <p id="description">The credential is stored securely on this computer for this speech endpoint.</p>
  <form id="token-form">
    <label id="token-label" for="token">Credential</label>
    <input id="token" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="4096" required>
    <div class="actions">
      <button id="save" type="submit">Save credential</button>
      <button id="remove" type="button" disabled>Remove saved credential</button>
      <button id="cancel" type="button">Cancel</button>
    </div>
  </form>
  <p id="message" role="status" aria-live="polite"></p>
</body>
</html>
